<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dünya Gastronomi Atlası</title>
  <meta name="description" content="Ülkelerin simge lezzetleri, tarım ürünleri, ihracatı ve fotoğraflı yemek tarifleri, bir dünya küresi üzerinde.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("ga-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body>
  <div class="doodle" aria-hidden="true"><i></i></div>
  <div id="globe" aria-label="Dünya küresi"></div>

  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="title">Dünya Gastronomi Atlası</h1>
      <p data-i18n="subtitle">Ülkelerin mutfağı, tarlası ve sofrası</p>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"/></svg>
      <input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="Yemek ya da ülke ara…">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="tb-right">
      <button type="button" class="help" id="themebtn" aria-label="Gece moduna geç">🌙</button>
      <button type="button" class="help" id="helpbtn" data-i18n-aria="help" aria-label="Nasıl kullanılır?">?</button>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button type="button" data-lang="tr">TR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="rank" id="rank" hidden aria-label="Sıralama"></nav>
  <div class="gamebar" id="gamebar"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="bottom" id="bottom">
    <nav class="dock" id="dock" aria-label="Mercekler"></nav>
  </div>
  <div class="legend" id="legend"></div>

  <div class="mcard" id="mcard" hidden></div>
  <div class="ptip" id="ptip" hidden></div>
  <div class="ctip" id="ctip" hidden></div>
  <div class="relcard" id="relcard" hidden></div>

  <footer class="credit"><span data-i18n="credit">Doç. Dr. Emirhan Yenişehirlioğlu tarafından hazırlanmıştır</span></footer>

  <div class="intro" id="intro" hidden></div>

  <aside class="panel" id="panel" aria-hidden="true">
    <div class="p-grab" id="pgrab" aria-hidden="true"><i></i></div>
    <button class="close" id="close" data-i18n-aria="close" aria-label="Kapat">×</button>
    <div id="panel-head"></div>
    <div id="panel-body"></div>
  </aside>

  <div class="modal" id="modal" hidden>
    <div class="modal-back" data-close></div>
    <article class="recipe" role="dialog" aria-modal="true" aria-labelledby="r-title">
      <button class="close" data-close data-i18n-aria="close" aria-label="Kapat">×</button>
      <div id="recipe-body"></div>
    </article>
  </div>

  <div class="modal" id="topmodal" hidden>
    <div class="modal-back" data-tclose></div>
    <article class="recipe topbox" role="dialog" aria-modal="true">
      <button class="close" data-tclose data-i18n-aria="close" aria-label="Kapat">×</button>
      <div id="top-body"></div>
    </article>
  </div>

  <div class="modal" id="gmodal" hidden>
    <div class="modal-back" data-gclose></div>
    <article class="recipe gbox" role="dialog" aria-modal="true">
      <button class="close" data-gclose data-i18n-aria="close" aria-label="Kapat">×</button>
      <div id="g-body"></div>
    </article>
  </div>

  <div class="error" id="error" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
