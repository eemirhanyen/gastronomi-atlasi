name: İçerik üret
on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Aşamalar (all ya da: score plan recipes review items images build)"
        default: "all"
      only:
        description: "Yalnızca bu ülkeler (ör. TUR,ITA; boş = hepsi)"
        default: ""
      model:
        description: "Model"
        default: "claude-haiku-5-5"
permissions:
  contents: write
concurrency: data-write
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ONLY: ${{ inputs.only }}
      AI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Çalıştır
        run: |
          save() {
            git config user.name "atlas-bot"; git config user.email "atlas-bot@users.noreply.github.com"
            git add -A data
            git diff --cached --quiet || git commit -q -m "İçerik: $1"
            git pull -q --rebase && git push -q
          }
          set -o pipefail
          stages="${{ inputs.stages }}"
          [ "$stages" = "all" ] && stages="score plan recipes review items images build"
          for s in $stages; do
            python scripts/content.py "$s" 2>&1 | tee -a data/work/log.txt || { save "$s (hata)"; exit 1; }
            save "$s"
          done
