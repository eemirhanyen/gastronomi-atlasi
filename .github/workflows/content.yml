name: İçerik üret
on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Aşamalar (all ya da: score flavors plan recipes review items images build)"
        default: "all"
      only:
        description: "Yalnızca bu ülkeler (ör. TUR,ITA; boş = hepsi)"
        default: ""
      model:
        description: "Model"
        default: "claude-haiku-5-5"
permissions:
  contents: write
concurrency:
  group: content
  cancel-in-progress: false
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ONLY: ${{ inputs.only }}
      AI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Çalıştır
        run: |
          save() {
            git config user.name "atlas-bot"; git config user.email "atlas-bot@users.noreply.github.com"
            git add -A data
            git diff --cached --quiet || git commit -q -m "İçerik: $1"
            # Çakışmada bu işin ürettiği veri öncelikli (-X theirs = yeniden uygulanan kendi commit'imiz).
            # Gönderilemezse iş sessizce "başarılı" bitmesin: sonuç kaybolur (bkz. 24 Ekim pilot).
            ok=""
            for i in 1 2 3 4 5; do
              if git pull -q --rebase -X theirs && git push -q; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep $((i * 5))
            done
            [ -n "$ok" ] || { echo "HATA: değişiklikler depoya gönderilemedi"; exit 1; }
          }
          set -o pipefail
          stages="${{ inputs.stages }}"
          [ "$stages" = "all" ] && stages="score flavors plan recipes review items images build"
          for s in $stages; do
            python scripts/content.py "$s" 2>&1 | tee -a data/work/log.txt || { save "$s (hata)"; exit 1; }
            save "$s"
          done
