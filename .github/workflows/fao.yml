name: FAO verisi
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 2 *"   # yılda bir, şubat başı
permissions:
  contents: write
concurrency: data-write
jobs:
  fao:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_fao.py
      - name: Kaydet
        run: |
          git config user.name "atlas-bot"; git config user.email "atlas-bot@users.noreply.github.com"
          git add data/fao.json
          git diff --cached --quiet || git commit -m "FAO verisi güncellendi"
          git pull --rebase && git push
